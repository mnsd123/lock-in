<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tập Tết">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Tập Tết 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Một thế giới tối duy nhất: nền đen, chữ sáng, nhấn cam lửa. Bố cục: một cột cuộn, thanh tab cố định dưới đáy. */
:root{
  --bg:#050505; --card:#0E0E10; --card2:#141416; --line:#1C1C1F; --line2:#2E2E33;
  --text:#F4F4F5; --muted:#A1A1AA; --dim:#8B8B93; --faint:#6E6E76;
  --acc:#FF6A26; --acc2:#FF8A4A; --good:#4ADE80; --bad:#F87171;
  --font:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
body{overscroll-behavior-y:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
#main{padding:calc(var(--top) + 14px) 16px calc(var(--bot) + 170px);max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.05;margin:0;text-wrap:balance}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chip{font-size:11px;padding:4px 8px;border-radius:8px;background:#1A1A1D;color:#D4D4D8;white-space:nowrap}
.chip.acc{background:#2A1407;color:var(--acc2)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12px} .tiny{font-size:11px}
.btn{height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);font-size:14px;font-weight:600}
.btn.primary{background:linear-gradient(180deg,var(--acc2),#E8561C);border:none;color:#140600}
.btn.light{background:var(--text);color:var(--bg);border:none}
.btn.ghost{background:transparent}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line2);background:var(--card2);display:flex;align-items:center;justify-content:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:3px;border-radius:12px;background:var(--card2)}
.seg button{height:34px;border:none;border-radius:9px;background:transparent;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);font-weight:700}
input.cell,select.field,input.field{height:44px;border-radius:12px;border:1px solid #232327;background:#0B0B0C;font-size:16px;text-align:center;width:100%;min-width:0}
input.field,select.field{text-align:left;padding:0 12px}
input.cell.done{background:#1A1A1D;color:var(--text)}
input.cell::placeholder{color:#55555C}

/* Hero buổi tập */
.hero{position:relative;border-radius:22px;background:radial-gradient(120% 90% at 85% 20%,#2A1407 0%,#0E0E10 55%);border:1px solid #1F1F23;padding:16px;display:flex;gap:8px;min-height:200px}
.hero h1{font-size:34px}
.daystrip{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr)) 44px;gap:4px;align-items:center}
.day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:12px;background:var(--card);border:1px solid transparent;font-size:10px;color:var(--dim)}
.day b{font-family:var(--mono);font-size:15px;color:var(--text)}
.day[aria-current="date"]{background:var(--text);color:var(--bg)} .day[aria-current="date"] b{color:var(--bg)}
.day.done{border-color:#6A2A0E} .day.done i{background:var(--acc)}
.day i{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:2px}
.day.today{border-color:var(--line2)}

/* Bài tập */
.ex{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ex.open{border-color:#3A1E10}
.exhead{width:100%;border:none;background:transparent;text-align:left;padding:14px;display:flex;align-items:center;gap:12px}
.exnum{font-family:var(--mono);font-size:13px;color:var(--faint);width:20px}
.exprog{font-family:var(--mono);font-size:13px;color:var(--dim)}
.ex.complete .exprog{color:var(--acc)}
.exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:9px}
.setgrid{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 56px 46px;gap:8px;align-items:center}
.sethead{font-size:10px;font-weight:600;letter-spacing:1px;color:var(--faint);text-align:center}
.sethead span:first-child{text-align:left}
.setn{font-family:var(--mono);font-size:15px;color:var(--faint)}
.setn.on{color:var(--acc)}
.check{width:46px;height:44px;border-radius:12px;border:1px solid var(--line2);background:transparent;display:flex;align-items:center;justify-content:center;color:transparent}
.check[aria-pressed="true"]{border:none;background:linear-gradient(180deg,var(--acc2),#E8561C);color:#140600}
.hint{font-size:12px;line-height:1.5;color:var(--muted);background:#0B0B0C;border-radius:12px;padding:10px 12px}
.hint.up{color:var(--acc2);background:#1A0D06}
.linkbtn{border:none;background:none;padding:6px 0;font-size:12px;font-weight:600;color:var(--acc2)}

/* Thống kê */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tile span{font-size:9px;letter-spacing:1px;color:var(--dim);font-weight:600}
.tile b{font-family:var(--mono);font-size:22px;line-height:1}
.bodymap{border-radius:22px;background:radial-gradient(90% 60% at 50% 40%,#1A0E08 0%,#070707 70%);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
.figs{display:flex;justify-content:space-around;align-items:flex-end}
.figs figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim)}
.legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim)}
.legend i{width:20px;height:8px;border-radius:4px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.track{height:8px;border-radius:4px;background:#1A1A1D;overflow:hidden}
.track div{height:8px;border-radius:4px}
.heat{display:grid;grid-template-columns:20px repeat(12,minmax(0,1fr));gap:4px;font-size:9px;color:var(--faint)}
.heat i{aspect-ratio:1;border-radius:3px;background:#151517}
svg.chart text{font-family:var(--mono);font-size:10px;fill:var(--dim)}

/* Lịch */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wday{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:9px;color:var(--dim)}
.wday b{font-family:var(--mono);font-size:13px;color:var(--text)}
.wday.done{background:#2A1407;border-color:#6A2A0E;color:var(--acc2)}
.wday.miss{border-color:#4A1F1F}
.wday.today{outline:2px solid var(--text);outline-offset:-2px}
.wday.empty{visibility:hidden}
.wday.ib{box-shadow:inset 0 -3px 0 #4ADE80}

/* Nav + timer */
nav{position:fixed;left:0;right:0;bottom:0;background:#0B0B0C;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:var(--bot);z-index:5}
nav button{height:64px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--dim)}
nav button[aria-current="page"]{color:var(--acc);font-weight:700}
#timer{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 74px);max-width:536px;margin:0 auto;padding:10px 12px;border-radius:18px;background:#141416;border:1px solid var(--line2);box-shadow:0 10px 30px #000;display:none;align-items:center;gap:10px;z-index:6}
#timer.show{display:flex}
#timer .t{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--acc2);min-width:70px}
#timer.over .t{color:var(--good)}
#toast{position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;z-index:9;display:none;max-width:90vw}
#toast.show{display:block}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line2);border-radius:20px;padding:18px;max-width:340px}
dialog::backdrop{background:rgba(0,0,0,.7)}
@media (prefers-reduced-motion:no-preference){.ex,.btn,.check{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main id="main" aria-live="polite"></main>

<div id="timer" role="timer" aria-live="off">
  <span class="t" id="timerT">0:00</span>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">
    <span class="small muted" id="timerL">Nghỉ</span>
    <div class="track" style="height:4px"><div id="timerBar" style="height:4px;width:0;background:var(--acc)"></div></div>
  </div>
  <button class="btn" style="height:38px;padding:0 10px;font-size:12px" data-act="timerAdd">+15s</button>
  <button class="btn light" style="height:38px;padding:0 12px;font-size:12px" data-act="timerStop">Bỏ qua</button>
</div>

<nav aria-label="Điều hướng">
  <button data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M2 11v2M22 11v2"/></svg>Hôm nay</button>
  <button data-tab="plan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Lịch</button>
  <button data-tab="stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Thống kê</button>
  <button data-tab="body"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Cơ thể</button>
</nav>
<div id="toast" role="status"></div>
<dialog id="dlg"><p id="dlgText" style="margin:0 0 16px;line-height:1.5"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="dlgNo">Huỷ</button><button class="btn primary" id="dlgYes">Đồng ý</button></div></dialog>

<script>
"use strict";
/* ================= DỮ LIỆU PLAN ================= */
const PLAN_START = '2026-11-20', W1 = '2026-11-23', PLAN_END = '2027-02-05', TET = '2027-02-06';
const INBODY_DAYS = { '2026-12-20': 'InBody mốc 1', '2027-01-17': 'InBody mốc 2', '2027-02-05': 'InBody cuối' };

const MUSCLES = {
  chest:'Ngực', fdelt:'Vai trước', sdelt:'Vai giữa', rdelt:'Vai sau', traps:'Cầu vai · lưng giữa', lats:'Lưng xô',
  biceps:'Tay trước', triceps:'Tay sau', forearm:'Cẳng tay', abs:'Bụng', oblique:'Liên sườn',
  quad:'Đùi trước', ham:'Đùi sau', glute:'Mông', adductor:'Đùi trong', calf:'Bắp chân', lowback:'Lưng dưới'
};

// sets: [GD1, GD2, GD3]; reps: [GD1, GD2, GD3]
const SESSIONS = {
  pushA: { name:'Push A', tag:'Nặng', focus:'Ngực, vai, tay trước + chân nhẹ', dur:'70–80 phút', ex:[
    { id:'bench', name:'Bench press', alt:'Dumbbell bench hoặc máy chest press', rule:'cb', type:'main', sets:[4,4,5], reps:['6–8','5–7','4–6'], rest:'2:30–3:00', inc:'+2.5 kg', m:{chest:1,fdelt:.5,triceps:.5}, tip:'5 điểm tiếp xúc, kéo bả vai về sau và xuống, hạ thanh chạm ngực dưới, khuỷu 45–60°.' },
    { id:'ohp', name:'Overhead press', type:'main', sets:[3,3,4], reps:['6–8','5–7','4–6'], rest:'2:30', inc:'+2.5 kg', m:{fdelt:1,sdelt:.5,triceps:.5}, tip:'Siết mông và bụng, thanh đi sát mặt, khoá tay ngay trên đầu, không ưỡn lưng.' },
    { id:'incdb', name:'Incline dumbbell press', alt:'Incline machine hoặc Smith incline', rule:'cb', type:'acc', sets:[3,3,3], reps:['8–10','8–10','6–10'], rest:'2:00', inc:'+1–2 kg', m:{chest:1,fdelt:.5} },
    { id:'latraise', name:'Lateral raise', type:'iso', sets:[3,4,4], reps:['12–15','12–15','12–20'], rest:'1:00–1:15', inc:'+1 kg', m:{sdelt:1}, tip:'Khuỷu cong nhẹ, nâng ngang vai, tay hơi chếch trước thân, không nhún vai.' },
    { id:'bbcurl', name:'Barbell hoặc EZ curl', type:'acc', sets:[3,3,3], reps:['8–10','8–10','6–10'], rest:'1:30', inc:'+2.5 kg', m:{biceps:1,forearm:.5} },
    { id:'squat', name:'Squat (nhẹ)', alt:'Leg press (nhẹ)', rule:'odd', type:'leg', leg:true, sets:[3,3,3], reps:['8–10','8–10','6–10'], rest:'2:00–2:30', inc:'+2.5 kg', m:{quad:1,glute:.5,adductor:.5}, tip:'Tuần lẻ squat, tuần chẵn leg press. Dừng ở RIR 2–3, lưng hoặc gối khó chịu thì đổi sang leg press.' },
    { id:'legext', name:'Leg extension', type:'leg', leg:true, sets:[3,3,3], reps:['12–15','12–15','10–15'], rest:'1:15', inc:'+1 nấc', m:{quad:1}, tip:'Duỗi hết, siết 1 giây, hạ chậm 3 giây.' }
  ]},
  pullB: { name:'Pull B', tag:'Volume', focus:'Lưng, vai sau, tay sau · không tập chân', dur:'60–70 phút', ex:[
    { id:'latpd', name:'Lat pulldown grip rộng', alt:'Neutral-grip, V-bar hoặc pull-up trợ lực', rule:'cb', type:'main', sets:[3,4,4], reps:['8–12','8–12','8–10'], rest:'2:00', inc:'+1 nấc', m:{lats:1,biceps:.5,rdelt:.25}, tip:'Kéo khuỷu xuống về phía túi quần, ngực hướng lên, ngả người không quá 15–20°.' },
    { id:'highrow', name:'High row machine', alt:'One-arm dumbbell row hoặc seated cable row', rule:'cb', type:'acc', sets:[3,3,4], reps:['10–12','10–12','8–12'], rest:'1:30–2:00', inc:'+1 nấc', m:{traps:1,lats:.5,rdelt:.5,biceps:.5}, tip:'Ngực tựa đệm, kéo khuỷu xuống và hơi ra sau, không nhún vai, siết 1 giây.' },
    { id:'ohtri', name:'Overhead cable triceps extension', type:'acc', sets:[3,4,4], reps:['10–12','10–12','10–12'], rest:'1:15–1:30', inc:'+1 nấc', m:{triceps:1} },
    { id:'ropepd', name:'Rope pushdown hoặc dip', type:'iso', sets:[3,3,3], reps:['10–12','10–12','8–12'], rest:'1:15', inc:'+1 nấc', m:{triceps:1} },
    { id:'facepull', name:'Face pull', type:'iso', sets:[3,3,3], reps:['15','15','15'], rest:'1:00', inc:'+1 nấc', m:{rdelt:1,traps:.5}, tip:'Dây ngang mắt, kéo về trán, khuỷu cao, xoay ngoài vai ở cuối.' }
  ]},
  pushB: { name:'Push B', tag:'Volume', focus:'Ngực trên, vai, tay trước · không tập chân', dur:'60–70 phút', ex:[
    { id:'dbsp', name:'Dumbbell shoulder press (ngồi)', type:'main', sets:[3,4,4], reps:['8–10','8–10','6–10'], rest:'2:00', inc:'+1–2 kg', m:{fdelt:1,sdelt:.5,triceps:.5} },
    { id:'incbb', name:'Incline barbell hoặc Smith press', alt:'Incline dumbbell hoặc incline machine', rule:'cb', type:'acc', sets:[3,4,4], reps:['8–10','8–10','6–10'], rest:'2:00–2:30', inc:'+2.5 kg', m:{chest:1,fdelt:.5,triceps:.25}, tip:'Ghế khoảng 30°, hạ về ngực trên, khuỷu không mở quá rộng.' },
    { id:'cablefly', name:'Low-to-high cable fly', alt:'Pec deck hoặc dumbbell fly', rule:'cb', type:'iso', sets:[3,3,3], reps:['12–15','12–15','10–15'], rest:'1:15', inc:'+1 nấc', m:{chest:1}, tip:'Kéo từ thấp lên ngực trên, khuỷu cong nhẹ, siết 1 giây ở đỉnh.' },
    { id:'cablelat', name:'Cable lateral raise', type:'iso', sets:[3,4,4], reps:['15–20','15–20','15–20'], rest:'1:00', inc:'+1 nấc', m:{sdelt:1} },
    { id:'inccurl', name:'Incline dumbbell curl', type:'iso', sets:[3,3,3], reps:['10–12','10–12','10–12'], rest:'1:15–1:30', inc:'+1 kg', m:{biceps:1}, tip:'Tựa lưng 45–60°, tay buông thẳng sau thân để bắp tay giãn hết.' },
    { id:'hammer', name:'Hammer curl', type:'iso', sets:[2,3,3], reps:['10–12','10–12','10–12'], rest:'1:00–1:15', inc:'+1 kg', m:{biceps:.5,forearm:1} }
  ]},
  pullA: { name:'Pull A', tag:'Nặng', focus:'Lưng, vai sau, tay sau ưu tiên + chân nhẹ', dur:'70–80 phút', ex:[
    { id:'csrow', name:'Chest-supported row machine', alt:'Barbell row machine (linear) hoặc seated cable row', rule:'cb', type:'main', sets:[4,4,4], reps:['6–8','6–8','5–7'], rest:'2:30', inc:'+1 nấc', m:{traps:1,lats:.5,rdelt:.5,biceps:.5}, tip:'Ngực tựa chắc, khuỷu 45°, kéo về sườn dưới, siết bả vai 1 giây, hạ 2–3 giây.' },
    { id:'pullup', name:'Pull-up (trợ lực nếu cần)', alt:'Lat pulldown', type:'main', sets:[3,4,4], reps:['6–10','6–10','5–8'], rest:'2:00', inc:'+1 nấc / bớt trợ lực', m:{lats:1,biceps:.5}, tip:'Treo thẳng tay, kéo ngực lên thanh, không đung đưa.' },
    { id:'skull', name:'Skullcrusher', alt:'Overhead triceps extension', type:'acc', sets:[3,4,4], reps:['8–12','8–12','8–10'], rest:'1:30', inc:'+2.5 kg', m:{triceps:1}, tip:'Khuỷu cố định hướng lên trần, hạ thanh về trán. Đau khuỷu thì đổi sang overhead bằng cáp.' },
    { id:'tripd', name:'Triceps pushdown', type:'iso', sets:[2,3,3], reps:['10–12','10–12','10–12'], rest:'1:00–1:15', inc:'+1 nấc', m:{triceps:1} },
    { id:'rdfly', name:'Rear delt fly hoặc reverse pec deck', type:'iso', sets:[3,3,4], reps:['12–15','15','15'], rest:'1:00', inc:'+1 nấc', m:{rdelt:1,traps:.25} },
    { id:'legcurl', name:'Leg curl nằm', alt:'Leg curl ngồi', rule:'odd', type:'leg', leg:true, sets:[3,3,3], reps:['10–12','10–12','8–12'], rest:'1:30', inc:'+1 nấc', m:{ham:1}, tip:'Hạ chậm 3 giây, không giật hông khỏi ghế. Tuần chẵn đổi sang leg curl ngồi.' },
    { id:'adduct', name:'Hip adduction', type:'leg', leg:true, sets:[3,3,3], reps:['12–15','12–15','12–15'], rest:'1:00', inc:'+1 nấc', m:{adductor:1}, tip:'Ngồi thẳng lưng, khép chậm, dừng 1 giây, mở lại 2–3 giây.' }

  const reps = repsFor(ex, w), rir = rirFor(ex, w);
  let h = `<article class="ex${open ? ' open' : ''}${done === e.sets.length ? ' complete' : ''}">
    <button class="exhead" data-act="toggle" data-id="${ex.id}" aria-expanded="${open}">

      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><b style="font-size:15px">${esc(exName(ex, e.v))}</b><span class="small dim">${e.sets.length} × ${reps} · nghỉ ${ex.rest}${ex.leg ? ' · chân nhẹ' : ''}</span></span>
      <span class="exprog">${done}/${e.sets.length}</span></button>`;
  if (open) {

    h += `<div class="exbody">`;
    if (hint) h += `<div class="hint${hint.up ? ' up' : ''}">Lần trước (${short(hint.last.date)}): ${hint.last.sets.map(x => `${x.kg}×${x.rep}`).join(', ')}${hint.up ? `. Đã chạm ${reps.split('–').pop()} rep mọi set: tăng ${ex.inc}.` : '.'}</div>`;
    h += `<div class="setgrid sethead"><span>SET</span><span>KG</span><span>REP</span><span>RIR</span><span></span></div>`;

      h += `<div class="setgrid"><span class="setn${x.done ? ' on' : ''}">${j + 1}</span>
        <input class="cell mono${dc}" type="number" inputmode="decimal" step="0.5" aria-label="Kg set ${j + 1}" placeholder="kg" value="${esc(x.kg)}" data-act="set" data-id="${ex.id}" data-j="${j}" data-f="kg">
        <input class="cell mono${dc}" type="number" inputmode="numeric" aria-label="Rep set ${j + 1}" placeholder="${esc(reps)}" value="${esc(x.rep)}" data-act="set" data-id="${ex.id}" data-j="${j}" data-f="rep">
        <input class="cell mono${dc}" type="number" inputmode="numeric" aria-label="RIR set ${j + 1}" placeholder="${esc(rir)}" value="${esc(x.rir)}" data-act="set" data-id="${ex.id}" data-j="${j}" data-f="rir">
        <button class="check" aria-pressed="${x.done}" aria-label="Xong set ${j + 1}" data-act="done" data-id="${ex.id}" data-j="${j}">${CHECK}</button></div>`;
    });
    h += `<div class="row" style="flex-wrap:wrap;gap:4px 16px"><button class="linkbtn" data-act="addset" data-id="${ex.id}">+ Thêm set</button>${e.sets.length > 1 ? `<button class="linkbtn" style="color:var(--dim)" data-act="delset" data-id="${ex.id}">Bớt 1 set</button>` : ''}${ex.alt ? `<button class="linkbtn" data-act="variant" data-id="${ex.id}">Đổi sang: ${esc(exName(ex, e.v ? 0 : 1))}</button>` : ''}</div>`;
    if (ex.tip) h += `<div class="hint">${esc(ex.tip)} RIR mục tiêu ${rir}.</div>`;
    h += `</div>`;
  }
  return h + `</article>`;
}

function viewPlan() {

    const cur = weekOf(t) === w;

function lineChart(points, opts) {
  // points: [{x: dateStr, y: number}]
  const W = 340, H = 150, P = { l: 34, r: 10, t: 12, b: 22 };
  if (points.length < 1) return `<p class="small dim">${opts.empty}</p>`;
  const xs = points.map(p => D(p.x).getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0) { x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let ys = points.map(p => p.y); if (opts.band) ys = ys.concat(opts.band);
  let y0 = Math.min(...ys), y1 = Math.max(...ys); const padY = Math.max(.5, (y1 - y0) * .15); y0 = Math.floor(y0 - padY); y1 = Math.ceil(y1 + padY);
  const X = v => P.l + (v - x0) / (x1 - x0) * (W - P.l - P.r), Y = v => P.t + (1 - (v - y0) / (y1 - y0)) * (H - P.t - P.b);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1C1C1F"/><text x="${P.l - 6}" y="${Y(v) + 3}" text-anchor="end">${(Math.round(v * 10) / 10)}</text>`; }
  if (opts.band) g += `<rect x="${P.l}" width="${W - P.l - P.r}" y="${Y(opts.band[1])}" height="${Y(opts.band[0]) - Y(opts.band[1])}" fill="#4ADE80" fill-opacity=".1"/><text x="${W - P.r - 2}" y="${Y(opts.band[1]) - 3}" text-anchor="end" style="fill:#4ADE80">mục tiêu</text>`;
  const sorted = points.slice().sort((a, b) => a.x < b.x ? -1 : 1);
  const path = sorted.map((p, i) => `${i ? 'L' : 'M'}${X(D(p.x).getTime()).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area = path + ` L${X(D(sorted[sorted.length - 1].x).getTime()).toFixed(1)} ${H - P.b} L${X(D(sorted[0].x).getTime()).toFixed(1)} ${H - P.b} Z`;
  const last = sorted[sorted.length - 1];
  g += `<path d="${area}" fill="url(#ag)"/><path d="${path}" fill="none" stroke="#FF6A26" stroke-width="2"/>`;
  sorted.forEach(p => g += `<circle cx="${X(D(p.x).getTime())}" cy="${Y(p.y)}" r="2.5" fill="#FF8A4A"/>`);
  g += `<circle cx="${X(D(last.x).getTime())}" cy="${Y(last.y)}" r="5" fill="#FF6A26" stroke="#050505" stroke-width="2"/>`;
  g += `<text x="${P.l}" y="${H - 6}">${short(ymd(new Date(x0)))}</text><text x="${W - P.r}" y="${H - 6}" text-anchor="end">${short(ymd(new Date(x1)))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label)}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF6A26" stop-opacity=".35"/><stop offset="1" stop-color="#FF6A26" stop-opacity="0"/></linearGradient></defs>${g}</svg>`;
}

function viewStats() {

    if (isTrained(d)) { streak++; continue; }

  const bw = S.body.slice().sort((a, b) => a.date < b.date ? -1 : 1).filter(b => b.weight);

  </div>

    <div class="seg">${[[7,'7 ngày'],[30,'30 ngày'],[90,'90 ngày'],[0,'Tất cả']].map(([v, n]) => `<button aria-pressed="${UI.range === v}" data-act="range" data-v="${v}">${n}</button>`).join('')}</div>
    <div class="figs"><figure>${figure(false, L.front, 150, 'Mặt trước')}<figcaption>Trước</figcaption></figure><figure>${figure(true, L.back, 150, 'Mặt sau')}<figcaption>Sau</figcaption></figure></div>

  const rows = Object.keys(MUSCLES).map(k => ({ k, v: vol[k], p: plan[k] })).filter(r => r.v > 0 || r.p > 0).sort((a, b) => b.v - a.v || b.p - a.p);
  h += `<section class="card"><div class="between"><b>Hiệp đã tập / kế hoạch</b><span class="tiny dim">${UI.range ? UI.range + ' ngày' : 'tất cả'}</span></div><div class="bars">`;

  rows.forEach(r => {

    ${lineChart(pts, { label: '1RM ước tính ' + ALLEX[lift].name, empty: 'Chưa có set nào của bài này. Mục tiêu đến Tết: +5–10% tạ ở bài chính, cùng số rep.' })}
    ${pts.length > 1 ? `<span class="small muted">Từ ${pts[0].y} lên ${pts[pts.length - 1].y} kg (${((pts[pts.length - 1].y / pts[0].y - 1) * 100).toFixed(1)}%). Công thức Epley: kg × (1 + rep/30).</span>` : ''}
  </section>`;
  return h;

/* ================= SỰ KIỆN ================= */
let audio;
function beep() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(audio.destination); o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .15); }); } catch (e) {} }
const timer = { end: 0, total: 0, beeped: false };
function startTimer(sec, label) { timer.end = Date.now() + sec * 1000; timer.total = sec; timer.beeped = false; $('#timerL').textContent = label; $('#timer').classList.add('show'); tick(); try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {} }
function tick() {
  if (!$('#timer').classList.contains('show')) return;
  const left = Math.round((timer.end - Date.now()) / 1000), a = Math.abs(left);
  $('#timerT').textContent = (left < 0 ? '+' : '') + Math.floor(a / 60) + ':' + pad(a % 60);
  $('#timerBar').style.width = Math.min(100, (1 - Math.max(0, left) / timer.total) * 100) + '%';
  $('#timer').classList.toggle('over', left <= 0);
  if (left <= 0 && !timer.beeped) { timer.beeped = true; beep(); $('#timerL').textContent = 'Hết giờ nghỉ, vào set tiếp'; }
}
setInterval(tick, 250);

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }
function ask(msg) { return new Promise(res => { const d = $('#dlg'); $('#dlgText').textContent = msg; const done = v => { d.close(); res(v); }; $('#dlgYes').onclick = () => done(true); $('#dlgNo').onclick = () => done(false); try { d.showModal(); } catch (e) { res(true); } }); }

document.addEventListener('click', async ev => {
  const nb = ev.target.closest('nav button'); if (nb) { UI.tab = nb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const act = b.dataset.act, s = UI.date;
  if (act === 'day') { UI.date = addDays(s, +b.dataset.n); UI.open = null; }
  else if (act === 'goto') { UI.date = b.dataset.d; UI.open = null; }
  else if (act === 'open') { UI.date = b.dataset.d; UI.tab = 'today'; UI.open = null; window.scrollTo(0, 0); }
  else if (act === 'toggle') { UI.open = UI.open === b.dataset.id ? null : b.dataset.id; }
  else if (act === 'done') {
    const log = getLog(s), e = log.ex[b.dataset.id], x = e.sets[+b.dataset.j], ex = ALLEX[b.dataset.id];
    x.done = !x.done;
    if (x.done) {
      const w = weekOf(s);
      if (x.rep === '') x.rep = String(parseInt(repsFor(ex, w), 10));
      if (x.kg === '' && +b.dataset.j > 0) x.kg = e.sets[+b.dataset.j - 1].kg;
      if (+b.dataset.j + 1 < e.sets.length && e.sets[+b.dataset.j + 1].kg === '') e.sets[+b.dataset.j + 1].kg = x.kg;
      const allDone = e.sets.every(y => y.done);
      if (allDone) { const list = exList(s, log.session); const i = list.findIndex(q => q.id === ex.id); const nxt = list.slice(i + 1).find(q => !(log.ex[q.id] && log.ex[q.id].sets.every(y => y.done))); UI.open = nxt ? nxt.id : null; startTimer(restSec(ex), nxt ? 'Nghỉ trước ' + nxt.name : 'Xong bài cuối'); }
      else startTimer(restSec(ex), `Nghỉ trước set ${+b.dataset.j + 2}`);
    }
    commit(s);
  }
  else if (act === 'addset') { const e = getLog(s).ex[b.dataset.id]; const l = e.sets[e.sets.length - 1]; e.sets.push({ kg: l ? l.kg : '', rep:'', rir:'', done:false }); commit(s); }
  else if (act === 'delset') { const e = getLog(s).ex[b.dataset.id]; e.sets.pop(); commit(s); }
  else if (act === 'variant') {
    const e = getLog(s).ex[b.dataset.id]; e.v = e.v ? 0 : 1;
    const last = lastSets(b.dataset.id, e.v, s); e.sets.forEach(x => { if (!x.done) x.kg = last ? last.sets[0].kg : ''; }); commit(s);
  }
  else if (act === 'finish') { const log = getLog(s); log.done = !log.done; commit(s); if (log.done) toast(`Xong ${SESSIONS[log.session].name}: ${doneSets(log)} set. Nhớ ăn đủ protein.`); }
  else if (act === 'ball') { const prev = (S.logs[s] && S.logs[s].ball) || {}; S.logs[s] = Object.assign(S.logs[s] || { session: 'ball', ex: {} }, { ball: { type: b.dataset.k, min: prev.min || '' }, done: b.dataset.k !== 'none' }); if (b.dataset.k === 'none') delete S.logs[s].ball; save(); }
  else if (act === 'range') { UI.range = +b.dataset.v; }
  else if (act === 'timerAdd') { timer.end += 15000; timer.total += 15; timer.beeped = false; tick(); return; }
  else if (act === 'timerStop') { $('#timer').classList.remove('show'); return; }
  else if (act === 'delbody') { if (!(await ask('Xoá số đo ngày ' + short(b.dataset.d) + '?'))) return; S.body = S.body.filter(x => x.date !== b.dataset.d); save(); }
  else if (act === 'export' || act === 'copy') {
    const json = JSON.stringify(Object.assign({ app: 'tt27', at: new Date().toISOString() }, S));
    if (act === 'copy') { try { await navigator.clipboard.writeText(json); toast('Đã sao chép dữ liệu. Dán vào Ghi chú để giữ.'); } catch (e) { toast('Không sao chép được, dùng Xuất file'); } return; }
    const a = $('#dl'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = `tap-tet-${todayStr()}.json`; a.textContent = 'Bấm vào đây để lưu file sao lưu'; a.style.display = 'block'; a.click(); return;
  }
  else return;
  render();
});

document.addEventListener('input', ev => {
  const el = ev.target; if (el.dataset.act !== 'set') return;
  const e = getLog(UI.date).ex[el.dataset.id]; e.sets[+el.dataset.j][el.dataset.f] = el.value; commit(UI.date);
});
document.addEventListener('change', async ev => {
  const el = ev.target, s = UI.date;
  if (el.dataset.act === 'swap') {
    if (S.logs[s] && doneSets(S.logs[s]) && !(await ask('Ngày này đã có set được ghi. Đổi buổi sẽ xoá các set đó. Tiếp tục?'))) { render(); return; }
    delete S.logs[s]; delete UI.drafts[s];
    if (el.value !== plannedSession(s)) { S.logs[s] = buildLog(s, el.value); }
    save(); UI.open = null; render();
  } else if (el.dataset.act === 'ballMin') {
    S.logs[s] = S.logs[s] || { session: 'ball', ex: {} }; S.logs[s].ball = Object.assign({ type: 'ball' }, S.logs[s].ball, { min: el.value }); S.logs[s].done = true; save(); render();
  } else if (el.dataset.act === 'lift') { UI.lift = el.value; render(); }
  else if (el.id === 'importFile' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      if (!data.logs || !data.body) throw new Error();
      if (!(await ask('Thay toàn bộ dữ liệu hiện tại bằng file sao lưu này?'))) return;
      S = { logs: data.logs, body: data.body }; save(); toast('Đã nhập dữ liệu'); render();
    } catch (e) { toast('File không đúng định dạng sao lưu của app'); }
  }
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'bodyForm') return; ev.preventDefault();
  const n = id => { const v = $(id).value; return v === '' ? '' : +v; };
  const entry = { date: $('#bDate').value, weight: n('#bWeight'), waist: n('#bWaist'), bfm: n('#bBfm'), pbf: n('#bPbf'), smm: n('#bSmm') };
  if (!entry.date || [entry.weight, entry.waist, entry.bfm, entry.pbf, entry.smm].every(v => v === '')) { toast('Nhập ít nhất một số đo'); return; }
  S.body = S.body.filter(b => b.date !== entry.date).concat(entry); save(); toast('Đã lưu số đo ' + short(entry.date)); render();
});

render();
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
</html>
